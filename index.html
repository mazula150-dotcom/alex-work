<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Номенклатура — база товаров, остатки и счета</title>
<meta name="description" content="Простое приложение для учёта номенклатуры: каталог, остатки, отчёт в Excel и счёт со стоимостью услуг.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f5bea'/%3E%3Cpath d='M20 22h24M20 32h24M20 42h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --ink: #151a24;
  --ink-2: #374151;
  --muted: #6b7486;
  --line: #e3e7ef;
  --line-2: #eef1f6;
  --accent: #2f5bea;
  --accent-2: #7a4dff;
  --accent-soft: #eaefff;
  --green: #0e9f6e;
  --green-soft: #e6f6ef;
  --red: #d92d20;
  --red-soft: #fdecea;
  --amber: #b54708;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 30px rgba(16, 24, 40, .06);
}

html, body { margin: 0; padding: 0; }

body {
  font-family: "Segoe UI", system-ui, -apple-system, "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  color: var(--ink);
  background:
    radial-gradient(1100px 420px at 12% -140px, #e6ecff 0%, rgba(230, 236, 255, 0) 70%),
    radial-gradient(900px 400px at 100% -80px, #efebff 0%, rgba(239, 235, 255, 0) 70%),
    var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--accent); }

/* ---------- layout ---------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(255, 255, 255, .9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.app-header .inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 22px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 230px; }
.logo {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -.02em;
  box-shadow: 0 6px 16px rgba(47, 91, 234, .3);
}
.brand h1 { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
.brand p { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

.tabs {
  display: flex;
  gap: 3px;
  background: #eef1f7;
  padding: 4px;
  border-radius: 12px;
}
.tab {
  border: 0;
  background: transparent;
  padding: 8px 16px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  color: #5b6474;
  transition: background .15s, color .15s, box-shadow .15s;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.active { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(16, 24, 40, .14); }

.header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.app-main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 26px 24px 90px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  transition: background .15s, border-color .15s, box-shadow .15s, transform .05s;
}
.btn:hover { border-color: #cbd4e4; background: #f8fafc; }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: linear-gradient(180deg, #3a67f2 0%, #2a52d8 100%);
  border-color: #2a52d8;
  color: #fff;
  box-shadow: 0 5px 14px rgba(47, 91, 234, .26);
}
.btn.primary:hover { filter: brightness(1.06); background: linear-gradient(180deg, #3a67f2 0%, #2a52d8 100%); }
.btn.small { padding: 7px 11px; font-size: 12.5px; border-radius: 9px; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger:hover { background: #b42318; border-color: #b42318; }
.btn.danger-ghost { color: var(--red); border-color: #f3c9c5; background: #fff; }
.btn.danger-ghost:hover { background: var(--red-soft); border-color: #eeb1ab; }
.btn.accent { color: var(--accent); border-color: #cdd9fb; background: #f3f7ff; }
.btn.accent:hover { background: #e9f0ff; border-color: #b7c9f8; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.icon-btn {
  width: 36px;
  height: 36px;
  display: inline-grid;
  place-items: center;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  color: var(--muted);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: #f1f4f9; color: var(--ink); }
.icon-btn.danger:hover { background: var(--red-soft); color: var(--red); }
#btn-cloud { position: relative; }
#btn-cloud::after {
  content: "";
  position: absolute;
  right: 7px;
  bottom: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #cbd5e1;
  border: 2px solid #fff;
}
#btn-cloud.on::after { background: var(--green); }
#btn-cloud.pending::after { background: #f59e0b; }
#btn-cloud.error::after { background: var(--red); }
.sync-btn { padding: 7px 11px; font-size: 12.5px; }
.sync-btn.off { color: var(--muted); }
.sync-btn.syncing .ico { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ico { flex: none; display: block; }

.link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 600;
}
.link:hover { text-decoration: underline; }

/* ---------- page head ---------- */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.page-title h2 { font-size: 25px; font-weight: 750; letter-spacing: -.02em; }
.page-title p { color: var(--muted); font-size: 13px; margin-top: 5px; }
.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.h3 { font-size: 15px; font-weight: 700; }
.h4 { font-size: 13.5px; font-weight: 700; }

/* ---------- kpi ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi::after {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  opacity: .85;
}
.kpi-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kpi-value { font-size: 23px; font-weight: 750; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

/* ---------- card / table ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-2);
  flex-wrap: wrap;
}
.card-head-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot-red { background: #d92d20; }
.dot-amber { background: #f59e0b; }
.table-wrap { overflow-x: auto; }

.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
}
.data-table th {
  text-align: left;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  background: #f8fafc;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.data-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-2);
  vertical-align: middle;
  font-size: 13.5px;
}
.data-table tbody tr:hover td { background: #fbfcff; }
.data-table tbody tr.row-zero td { background: #ffefec; }
.data-table tbody tr.row-zero:hover td { background: #ffe3de; }
.data-table tbody tr.row-low td { background: #fff7e0; }
.data-table tbody tr.row-low:hover td { background: #ffefc7; }
.data-table tbody tr.row-zero td:first-child { box-shadow: inset 3px 0 0 #d92d20; }
.data-table tbody tr.row-low td:first-child { box-shadow: inset 3px 0 0 #f59e0b; }
.data-table tbody tr:last-child td { border-bottom: 0; }

.qty-pill {
  display: inline-block;
  min-width: 36px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.qty-pill.zero { background: #fdecea; color: #b42318; }
.qty-pill.low { background: #fef3c7; color: #92400e; }
.stock-zero { color: #b42318; font-weight: 700; }
.stock-low { color: #b45309; font-weight: 700; }
.dot-green { background: #0e9f6e; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.status.in { color: var(--green); }
.status.low { color: #92400e; }
.status.zero { color: var(--red); }
.status.out { color: var(--muted); }
.catalog-table { min-width: 780px; }
.catalog-table .actions-col { width: 190px; }
.catalog-actions { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
.catalog-actions .btn { padding: 6px 10px; font-size: 12px; }
.catalog-preview { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
.catalog-preview-name { font-weight: 700; margin-bottom: 3px; }
.data-table .r { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .c { text-align: center; }
.data-table .actions-col { width: 90px; }
.cell-name { font-weight: 600; }
.cell-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.cell-empty { color: #b3bac7; }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; opacity: .65; transition: opacity .15s; }
.data-table tr:hover .row-actions { opacity: 1; }
.money-strong { font-weight: 650; }

.data-table tfoot td {
  background: #f8fafc;
  font-weight: 700;
  border-top: 1px solid var(--line);
  border-bottom: 0;
  font-size: 13px;
}
.data-table tfoot .r { font-variant-numeric: tabular-nums; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #2447c4;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
}

/* ---------- search ---------- */
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 0 12px;
  min-width: 320px;
  color: var(--muted);
  transition: border-color .15s, box-shadow .15s;
}
.search:focus-within { border-color: #93a9f7; box-shadow: 0 0 0 3px rgba(47, 91, 234, .1); }
.search input {
  border: 0;
  outline: 0;
  background: transparent;
  padding: 9px 0;
  font-size: 13.5px;
  width: 100%;
  color: var(--ink);
}
.search.small { min-width: 0; padding: 0 10px; border-radius: 9px; }
.search.small input { padding: 7px 0; font-size: 12.5px; }

/* ---------- empty ---------- */
.empty { padding: 46px 24px 50px; text-align: center; }
.empty.small { padding: 24px 12px; }
.empty-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 14px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
}
.empty-title { font-size: 16px; font-weight: 700; }
.empty-text { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 460px; margin-left: auto; margin-right: auto; }
.empty .head-actions { justify-content: center; margin-top: 16px; }

/* ---------- fields ---------- */
.field { display: block; margin-bottom: 14px; }
.field > span, .field > label { display: block; font-size: 12px; font-weight: 650; color: var(--ink-2); margin-bottom: 6px; }
.field em { color: var(--red); font-style: normal; }
.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid #d7dce6;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13.5px;
  background: #fff;
  outline: 0;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: #8aa4ff;
  box-shadow: 0 0 0 3px rgba(47, 91, 234, .12);
}
.field input::placeholder { color: #a8b0be; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  user-select: none;
}
.check input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.check.big { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #f8fafc; }

.hint { font-size: 12px; color: var(--muted); }
.hint b { color: var(--ink); }
#markup-hint { margin: -4px 0 14px; }

.banner {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  margin-bottom: 18px;
  border: 1px solid #f3d38a;
  background: #fff9ea;
  color: #7a4a03;
}

/* ---------- invoice layout ---------- */
.invoice-layout {
  display: grid;
  grid-template-columns: minmax(350px, .92fr) minmax(0, 1.08fr);
  gap: 18px;
  align-items: start;
}
.builder { padding: 18px; }
.builder .card-head { padding: 0 0 14px; border-bottom: 1px solid var(--line-2); margin-bottom: 16px; }
.picker-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
.picker-head .label { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.picker-head .muted { font-size: 12px; }

.picker {
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-top: 9px;
  max-height: 340px;
  overflow-y: auto;
  background: #fff;
}
.pick {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) auto 74px;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
  transition: background .12s;
}
.pick:last-child { border-bottom: 0; }
.pick:hover { background: #f8faff; }
.pick.sel { background: #f2f6ff; }
.pick input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
.pick-main { min-width: 0; }
.pick-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-price { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pick-qty {
  width: 74px;
  border: 1px solid #d7dce6;
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12.5px;
  text-align: right;
  outline: 0;
  font-variant-numeric: tabular-nums;
}
.pick-qty:focus { border-color: #8aa4ff; box-shadow: 0 0 0 3px rgba(47, 91, 234, .12); }
.pick-qty:disabled { background: #f6f8fb; color: #aab2c0; border-color: #e8ecf3; }

.builder-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--line-2);
  flex-wrap: wrap;
}
.draft-total { display: flex; flex-direction: column; }
.draft-total span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.draft-total b { font-size: 20px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.preview { background: #eaeef6; padding: 12px; }
.preview-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 4px 10px; }
.preview-caption { display: flex; align-items: center; gap: 10px; }

/* ---------- document ---------- */
.doc {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 6px 22px rgba(16, 24, 40, .1);
  padding: 30px 32px;
  font-size: 12px;
  line-height: 1.45;
  color: #1c2330;
}
.doc-head {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 2px solid #1f2a44;
  padding-bottom: 12px;
}
.doc-org { min-width: 0; }
.doc-org-name { font-size: 15px; font-weight: 750; line-height: 1.25; }
.doc-org > div { color: #55607a; font-size: 10.8px; margin-top: 2px; }
.doc-hint { color: #9aa3b5 !important; font-style: italic; }
.doc-meta { text-align: right; flex: none; }
.doc-kind { font-size: 21px; font-weight: 800; letter-spacing: .14em; color: #1f2a44; line-height: 1.1; }
.doc-num { color: #55607a; font-size: 11.5px; margin-top: 4px; white-space: nowrap; }
.doc-parties { display: grid; gap: 4px; margin: 12px 0 14px; font-size: 11.4px; }
.doc-parties span { color: #7b8499; }
.doc-table { width: 100%; border-collapse: collapse; font-size: 10.2px; table-layout: fixed; }
.doc-table th {
  background: #f1f4fa;
  border: 1px solid #d8dfea;
  padding: 5px 4px;
  font-size: 8.6px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
  color: #4b5565;
  line-height: 1.2;
}
.doc-table td { border: 1px solid #d8dfea; padding: 6px 5px; vertical-align: top; word-break: break-word; }
.doc-table th:nth-child(1), .doc-table td:nth-child(1) { width: 5%; }
.doc-table th:nth-child(2), .doc-table td:nth-child(2) { width: 31%; }
.doc-table th:nth-child(3), .doc-table td:nth-child(3) { width: 8%; }
.doc-table th:nth-child(4), .doc-table td:nth-child(4) { width: 9%; }
.doc-table th:nth-child(5), .doc-table td:nth-child(5) { width: 12.5%; }
.doc-table th:nth-child(6), .doc-table td:nth-child(6) { width: 12.5%; }
.doc-table th:nth-child(7), .doc-table td:nth-child(7) { width: 11%; }
.doc-table th:nth-child(8), .doc-table td:nth-child(8) { width: 11%; }
.doc-table .r { text-align: right; font-variant-numeric: tabular-nums; }
.doc-table .c { text-align: center; }
.doc-sku { display: block; font-size: 9px; color: #8b94a8; }
.doc-empty-cell { text-align: center; color: #9aa3b5; padding: 26px 8px !important; font-size: 11px; }
.doc-summary { width: min(330px, 100%); margin: 12px 0 0 auto; }
.doc-sum-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 0;
  border-bottom: 1px dashed #e2e8f0;
  font-size: 11.5px;
  color: #4b5565;
}
.doc-sum-row b { color: #1c2330; font-variant-numeric: tabular-nums; }
.doc-sum-row.total {
  border-bottom: 0;
  border-top: 2px solid #1f2a44;
  margin-top: 4px;
  padding-top: 8px;
  font-size: 14px;
  color: #1f2a44;
  align-items: baseline;
}
.doc-sum-row.total b { font-size: 16px; }

body.modal-open { overflow: hidden; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(15, 23, 42, .46);
  backdrop-filter: blur(3px);
  display: grid;
  place-items: center;
  padding: 18px;
  animation: fadeIn .14s ease-out;
}
.modal {
  background: #fff;
  border-radius: 18px;
  width: min(560px, 100%);
  max-height: calc(100vh - 36px);
  overflow-y: auto;
  padding: 22px 24px 20px;
  box-shadow: 0 30px 80px rgba(15, 23, 42, .32);

}

.data-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }

  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;

}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  background: #1f2a44;
  color: #fff;
  padding: 11px 15px;
  border-radius: 11px;
  font-size: 13px;

#print-root { display: none; }

@media print {

<script>
/* ------------------------------------------------------------------
   XLSX-LITE — минимальный генератор .xlsx без внешних зависимостей.
   Собирает ZIP (без сжатия) с нужными XML-частями книги.
   ------------------------------------------------------------------ */
const XLSX = (function () {
  'use strict';

  const encoder = new TextEncoder();
  const HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

  const crcTable = (function () {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function esc(value) {
    return String(value)
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')
      .replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[ch]));
  }

  function colName(index) {
    let n = index + 1;
    let s = '';
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  const STYLES = HEAD +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.00"/><numFmt numFmtId="165" formatCode="#,##0.###"/></numFmts>' +
    '<fonts count="6">' +
    '<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>' +
    '<font><b/><sz val="16"/><color rgb="FF1F2A44"/><name val="Calibri"/><family val="2"/></font>' +
    '<font><i/><sz val="10"/><color rgb="FF6B7486"/><name val="Calibri"/><family val="2"/></font>' +
    '<font><b/><sz val="12"/><color rgb="FF1F2A44"/><name val="Calibri"/><family val="2"/></font>' +
    '</fonts>' +
    '<fills count="4">' +
    '<fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF1F2A44"/><bgColor indexed="64"/></patternFill></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFEFF3F9"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="2">' +
    '<border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left style="thin"><color rgb="FFD5DCE8"/></left><right style="thin"><color rgb="FFD5DCE8"/></right><top style="thin"><color rgb="FFD5DCE8"/></top><bottom style="thin"><color rgb="FFD5DCE8"/></bottom><diagonal/></border>' +
    '</borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="20">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="top" wrapText="1"/></xf>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="164" fontId="1" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>' +
    '<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>' +
    '<xf numFmtId="165" fontId="1" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="5" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="164" fontId="5" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  function sheetXml(sheet) {
    const rows = sheet.rows || [];
    const cols = sheet.cols || [];
    const merges = sheet.merges || [];

    let maxCols = 0;
    rows.forEach((r) => { if (r && r.length > maxCols) maxCols = r.length; });
    const dim = 'A1:' + colName(Math.max(0, maxCols - 1)) + Math.max(1, rows.length);

    let xml = HEAD + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    xml += '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>';
    xml += '<dimension ref="' + dim + '"/>';
    xml += '<sheetViews><sheetView showGridLines="0" workbookViewId="0">';
    if (sheet.freeze) {
      xml += '<pane ySplit="' + sheet.freeze + '" topLeftCell="A' + (sheet.freeze + 1) + '" activePane="bottomLeft" state="frozen"/>';
    }
    xml += '</sheetView></sheetViews>';
    xml += '<sheetFormatPr defaultRowHeight="15"/>';

    if (cols.length) {
      xml += '<cols>' + cols.map((w, i) =>
        '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>';
    }

    xml += '<sheetData>';
    rows.forEach((row, r) => {
      const height = sheet.heights && sheet.heights[r];
      xml += '<row r="' + (r + 1) + '"' + (height ? ' ht="' + height + '" customHeight="1"' : '') + '>';
      (row || []).forEach((cell, c) => {
        if (cell === null || cell === undefined) return;
        const ref = colName(c) + (r + 1);
        let value;
        let style = 0;
        if (typeof cell === 'object') { value = cell.v; style = cell.s || 0; }
        else { value = cell; }
        const sAttr = style ? ' s="' + style + '"' : '';
        if (value === '' || value === null || value === undefined) {
          xml += '<c r="' + ref + '"' + sAttr + '/>';
        } else if (typeof value === 'number' && Number.isFinite(value)) {
          xml += '<c r="' + ref + '"' + sAttr + '><v>' + value + '</v></c>';
        } else {
          xml += '<c r="' + ref + '"' + sAttr + ' t="inlineStr"><is><t xml:space="preserve">' + esc(value) + '</t></is></c>';
        }
      });
      xml += '</row>';
    });
    xml += '</sheetData>';

    if (merges.length) {
      xml += '<mergeCells count="' + merges.length + '">' +
        merges.map((m) => '<mergeCell ref="' + m + '"/>').join('') + '</mergeCells>';
    }
    xml += '<pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>';
    xml += '<pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0" paperSize="9"/>';
    xml += '</worksheet>';
    return xml;
  }

  function safeSheetName(name, used) {
    let n = String(name).replace(/[\\/?*[\]:]/g, ' ').trim().slice(0, 31);
    if (!n) n = 'Лист';
    let base = n;
    let i = 2;
    while (used.has(n.toLowerCase())) {
      n = (base.slice(0, 28) + ' ' + i).slice(0, 31);
      i++;
    }
    used.add(n.toLowerCase());
    return n;
  }

  function zip(files) {
    const now = new Date();
    const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() >> 1) & 31);
    const dosDate = (((now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

    const localChunks = [];
    const centralChunks = [];
    let offset = 0;

    for (const file of files) {
      const nameBytes = encoder.encode(file.name);
      const data = file.data;
      const crc = crc32(data);

      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);
      localChunks.push(local, data);

      const central = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(central.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      central.set(nameBytes, 46);
      centralChunks.push(central);

      offset += local.length + data.length;
    }

    const centralSize = centralChunks.reduce((sum, c) => sum + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    const total = offset + centralSize + end.length;
    const out = new Uint8Array(total);
    let pos = 0;
    for (const chunk of localChunks) { out.set(chunk, pos); pos += chunk.length; }
    for (const chunk of centralChunks) { out.set(chunk, pos); pos += chunk.length; }
    out.set(end, pos);
    return out;
  }

function downloadXlsx(bytes, filename) {
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

      '<div class="form-row">' +
      '<label class="field"><span>Артикул</span><input name="sku" maxlength="60" autocomplete="off" value="' + esc(item ? item.sku : '') + '"></label>' +
      '<label class="field"><span>Ед. изм.</span><input name="unit" list="units" maxlength="12" autocomplete="off" value="' + esc(item ? item.unit : 'шт') + '"></label>' +
      '</div>' +
      '<div class="form-row">' +
      '<label class="field"><span>Цена закупки, \u20bd <em>*</em></span><input name="price" inputmode="decimal" autocomplete="off" placeholder="0,00" value="' + (item ? fmtNumInput(item.price) : '') + '"></label>' +
      '<label class="field"><span>Количество</span><input name="qty" inputmode="decimal" autocomplete="off" value="' + (item ? fmtNumInput(item.qty) : '0') + '"></label>' +
      '</div>' +
      '<div class="hint" id="sale-hint"></div>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn" data-close>Отмена</button>' +
      '<button type="submit" class="btn primary">Сохранить</button>' +
      '</div></form>',
      {
        onMount: function (modal, close) {
          const form = modal.querySelector('#item-form');
          const priceInput = form.elements.price;
          const hint = modal.querySelector('#sale-hint');

          const updateHint = function () {
            const p = toNum(priceInput.value);
            hint.innerHTML = p > 0
              ? 'Цена продажи с наценкой ' + fmtPct(markup) + '%: <b>' + money(p * (1 + markup / 100)) + '</b>'
              : 'Укажите закупочную цену, чтобы увидеть цену с наценкой.';
          };
          priceInput.addEventListener('input', updateHint);
          updateHint();

          form.addEventListener('submit', function (e) {
            e.preventDefault();
            const name = form.elements.name.value.trim();
            if (!name) {
              toast('Укажите наименование', 'error');
              form.elements.name.focus();
              return;
            }
            if (priceInput.value.trim() === '') {
              toast('Укажите цену закупки', 'error');
              priceInput.focus();
              return;
            }
            const data = {
              name: name,
              sku: form.elements.sku.value.trim(),
              unit: form.elements.unit.value.trim() || 'шт',
              price: round2(toNum(priceInput.value)),
              qty: round3(toNum(form.elements.qty.value)),
            };
            if (item) Object.assign(item, data);
            else state.items.push(Object.assign({ id: uid() }, data));
            saveState();
            close();
            renderApp();
            toast(item ? 'Позиция обновлена' : 'Позиция добавлена');
          });
        },
      }
    );
  }

  async function removeItem(id) {
    const item = state.items.find(function (x) { return x.id === id; });
    if (!item) return;
    const ok = await confirmDialog('Удалить позицию?', '«' + item.name + '» будет удалена из номенклатуры. Сохранённые счета останутся без изменений.', 'Удалить');
    if (!ok) return;
    state.items = state.items.filter(function (x) { return x.id !== id; });
    if (ui.draft && ui.draft.lines) delete ui.draft.lines[id];
    saveState();
    renderApp();
    toast('Позиция удалена');
  }

  /* ------------------------------ items ------------------------------ */

  function totals(items) {
    const markup = state.settings.markup;
    let qty = 0, cost = 0, sale = 0;
    items.forEach(function (it) {
      const q = toNum(it.qty);
      qty += q;
      cost += toNum(it.price) * q;
      sale += toNum(it.price) * (1 + markup / 100) * q;
    });
    return { qty: round3(qty), cost: round2(cost), sale: round2(sale) };
  }

  function kpiCards(cards) {
    return cards.map(function (c) {
      return '<div class="kpi"><div class="kpi-label">' + esc(c.label) + '</div>' +
        '<div class="kpi-value">' + c.value + '</div>' +
        '<div class="kpi-sub">' + esc(c.sub || '') + '</div></div>';
    }).join('');
  }

  function qtyRowClass(value) {
    const q = toNum(value);
    if (q <= 0) return 'row-zero';
    if (q <= LOW_STOCK) return 'row-low';
    return '';
  }

  function qtyCell(value) {
    const q = round3(toNum(value));
    if (q <= 0) return '<span class="qty-pill zero">' + fmtQty(q) + '</span>';
    if (q <= LOW_STOCK) return '<span class="qty-pill low">' + fmtQty(q) + '</span>';
    return fmtQty(q);
  }

  function stockLabel(value) {
    const q = round3(toNum(value));
    if (q <= 0) return '<span class="stock-zero">' + fmtQty(q) + '</span>';
    if (q <= LOW_STOCK) return '<span class="stock-low">' + fmtQty(q) + '</span>';
    return fmtQty(q);
  }

  function stockLegend() {
    return '<div class="legend">' +
      '<span class="legend-item"><i class="dot dot-red"></i>0 — нет в наличии</span>' +
      '<span class="legend-item"><i class="dot dot-amber"></i>' + LOW_STOCK + ' и меньше — мало</span>' +
      '</div>';
  }

  function renderItems(view) {
    view.innerHTML =
      '<div class="tab-page">' +
      '<div class="page-head">' +
      '<div class="page-title"><h2>Номенклатура</h2><p>Наименование, закупочная цена и количество на складе</p></div>' +
      '<div class="head-actions">' +
      '<button class="btn" data-act="export-items" title="Экспорт номенклатуры в Excel">' + icon('download') + '<span>В Excel</span></button>' +
      '<button class="btn primary" data-act="add-item">' + icon('plus') + '<span>Добавить позицию</span></button>' +
      '</div></div>' +
      '<div class="kpis" id="items-kpis"></div>' +
      '<section class="card">' +
      '<div class="card-head">' +
      '<div class="search">' + icon('search') + '<input id="items-search" type="search" placeholder="Поиск по наименованию или артикулу" value="' + esc(ui.itemSearch) + '"></div>' +
      '<div class="card-head-meta">' + stockLegend() + '<span class="muted" id="items-found"></span></div>' +
      '</div>' +
      '<div class="table-wrap"><table class="data-table items-table">' +
      '<thead><tr>' +
      '<th>Наименование</th><th>Артикул</th><th class="c">Ед.</th>' +
      '<th class="r">Цена, \u20bd</th><th class="r">Кол-во</th><th class="r">Сумма, \u20bd</th>' +
      '<th class="r">С наценкой</th><th class="actions-col"></th>' +
      '</tr></thead><tbody id="items-body"></tbody></table></div>' +
      '<div id="items-empty"></div>' +
      '</section></div>';

    const page = view.firstElementChild;
    const search = $('#items-search', page);
    search.addEventListener('input', function () {
      ui.itemSearch = search.value;
      paintItems();
    });

    page.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'add-item') openItemModal(null);
      else if (act === 'edit-item') openItemModal(btn.dataset.id);
      else if (act === 'del-item') removeItem(btn.dataset.id);
      else if (act === 'export-items') exportItems();
      else if (act === 'seed-demo') seedDemo();
    });

    paintItems();
  }

  function paintItems() {
    const body = $('#items-body');
    if (!body) return;

    const all = state.items;
    const query = ui.itemSearch.trim().toLowerCase();
    const list = query
      ? all.filter(function (it) { return (it.name + ' ' + it.sku).toLowerCase().indexOf(query) !== -1; })
      : all;
    const markup = state.settings.markup;
    const emptyEl = $('#items-empty');
    const foundEl = $('#items-found');

    if (!list.length) {
      body.innerHTML = '';
      foundEl.textContent = all.length ? 'Ничего не найдено' : '';
      emptyEl.innerHTML = all.length
        ? '<div class="empty"><div class="empty-icon">' + icon('search', 26) + '</div>' +
          '<div class="empty-title">Ничего не найдено</div>' +
          '<div class="empty-text">Попробуйте изменить запрос или очистить поиск.</div></div>'
        : '<div class="empty"><div class="empty-icon">' + icon('box', 28) + '</div>' +
          '<div class="empty-title">База пока пуста</div>' +
          '<div class="empty-text">Добавьте позицию вручную. Прайс-лист загружается в разделе «Каталог».</div>' +
          '<div class="head-actions"><button class="btn primary" data-act="add-item">' + icon('plus') + '<span>Добавить позицию</span></button>' +
          '<button class="btn" data-act="seed-demo">Загрузить пример</button></div></div>';
    } else {
      emptyEl.innerHTML = '';
      body.innerHTML = list.map(function (it) {
        const sum = it.price * it.qty;
        const sumSale = it.price * (1 + markup / 100) * it.qty;
        const rowClass = qtyRowClass(it.qty);
        return '<tr' + (rowClass ? ' class="' + rowClass + '"' : '') + '>' +
          '<td><div class="cell-name">' + esc(it.name) + '</div></td>' +
          '<td class="muted">' + (it.sku ? esc(it.sku) : '<span class="cell-empty">—</span>') + '</td>' +
          '<td class="c">' + esc(it.unit) + '</td>' +
          '<td class="r">' + fmtMoney(it.price) + '</td>' +
          '<td class="r">' + qtyCell(it.qty) + '</td>' +
          '<td class="r">' + fmtMoney(sum) + '</td>' +
          '<td class="r">' + fmtMoney(sumSale) + '</td>' +
          '<td class="r"><div class="row-actions">' +
          '<button class="icon-btn" data-act="edit-item" data-id="' + it.id + '" title="Изменить">' + icon('pencil') + '</button>' +
          '<button class="icon-btn danger" data-act="del-item" data-id="' + it.id + '" title="Удалить">' + icon('trash') + '</button>' +
          '</div></td></tr>';
      }).join('');
      foundEl.textContent = query ? 'Найдено: ' + list.length + ' из ' + all.length : 'Всего: ' + all.length;
    }

    const t = totals(all);
    $('#items-kpis').innerHTML = kpiCards([
      { label: 'Позиций в базе', value: all.length, sub: 'наименований' },
      { label: 'Остаток на складе', value: fmtQty(t.qty), sub: 'единиц' },
      { label: 'Себестоимость остатка', value: money(t.cost), sub: 'по закупочным ценам' },
      { label: 'С наценкой ' + fmtPct(markup) + '%', value: money(t.sale), sub: 'потенциальная выручка' },
    ]);
  }

  /* ------------------------------ catalog ------------------------------ */

  function findStockItem(cat) {
    if (!cat) return null;
    const sku = String(cat.sku || '').trim().toLowerCase();
    if (sku) {
      const bySku = state.items.find(function (it) {
        return String(it.sku || '').trim().toLowerCase() === sku;
      });
      if (bySku) return bySku;
    }
    const name = String(cat.name || '').trim().toLowerCase();
    return state.items.find(function (it) {
      return String(it.name || '').trim().toLowerCase() === name;
    }) || null;
  }

  function catalogStatus(cat) {
    const item = findStockItem(cat);
    if (!item) return '<span class="status out">нет на складе</span>';
    const q = toNum(item.qty);
    if (q <= 0) return '<span class="status zero"><i class="dot dot-red"></i>0 ' + esc(item.unit) + '</span>';
    if (q <= LOW_STOCK) return '<span class="status low"><i class="dot dot-amber"></i>' + fmtQty(q) + ' ' + esc(item.unit) + '</span>';
    return '<span class="status in"><i class="dot dot-green"></i>' + fmtQty(q) + ' ' + esc(item.unit) + '</span>';
  }

  function renderCatalog(view) {
    view.innerHTML =
      '<div class="tab-page">' +
      '<div class="page-head">' +
      '<div class="page-title"><h2>Каталог</h2><p>Прайс-лист: наименование, артикул и цена. Можно загрузить из Excel.</p></div>' +
      '<div class="head-actions">' +
      '<button class="btn" data-act="import-catalog" title="Импорт каталога из Excel или CSV">' + icon('upload') + '<span>Импорт</span></button>' +
      '<button class="btn" data-act="catalog-from-stock" title="Добавить в каталог позиции из номенклатуры">' + icon('box') + '<span>Из номенклатуры</span></button>' +
      '<button class="btn" data-act="export-catalog" title="Экспорт каталога в Excel">' + icon('download') + '<span>В Excel</span></button>' +
      '<button class="btn primary" data-act="add-catalog">' + icon('plus') + '<span>Добавить позицию</span></button>' +
      '</div></div>' +
      '<div class="kpis" id="catalog-kpis"></div>' +
      '<section class="card">' +
      '<div class="card-head">' +
      '<div class="search">' + icon('search') + '<input id="catalog-search" type="search" placeholder="Поиск по наименованию или артикулу" value="' + esc(ui.catalogSearch) + '"></div>' +
      '<span class="muted" id="catalog-found"></span>' +
      '</div>' +
      '<div class="table-wrap"><table class="data-table catalog-table">' +
      '<thead><tr><th>Наименование</th><th>Артикул</th><th class="r">Цена, \u20bd</th><th class="actions-col"></th></tr></thead>' +
      '<tbody id="catalog-body"></tbody></table></div>' +
      '<div id="catalog-empty"></div>' +
      '</section></div>';

    const page = view.firstElementChild;
    const search = $('#catalog-search', page);
    search.addEventListener('input', function () {
      ui.catalogSearch = search.value;
      paintCatalog();
    });

    page.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === 'add-catalog') openCatalogModal(null);
      else if (act === 'edit-catalog') openCatalogModal(btn.dataset.id);
      else if (act === 'del-catalog') removeCatalogItem(btn.dataset.id);
      else if (act === 'catalog-to-stock') openStockAddModal(btn.dataset.id);
      else if (act === 'catalog-from-stock') fillCatalogFromStock();
      else if (act === 'import-catalog') openImportModal('catalog');
      else if (act === 'export-catalog') exportCatalog();
    });

    paintCatalog();
  }

  function paintCatalog() {
    const body = $('#catalog-body');
    if (!body) return;
    const all = state.catalog;
    const query = ui.catalogSearch.trim().toLowerCase();
    const list = query
      ? all.filter(function (c) { return (c.name + ' ' + c.sku).toLowerCase().indexOf(query) !== -1; })
      : all;
    const emptyEl = $('#catalog-empty');
    const foundEl = $('#catalog-found');

    if (!list.length) {
      body.innerHTML = '';
      foundEl.textContent = all.length ? 'Ничего не найдено' : '';
      emptyEl.innerHTML = all.length
        ? '<div class="empty"><div class="empty-icon">' + icon('search', 26) + '</div>' +
          '<div class="empty-title">Ничего не найдено</div><div class="empty-text">Попробуйте изменить запрос.</div></div>'
        : '<div class="empty"><div class="empty-icon">' + icon('file', 28) + '</div>' +
          '<div class="empty-title">Каталог пуст</div>' +
          '<div class="empty-text">Добавьте позиции вручную, загрузите прайс из Excel или перенесите текущую номенклатуру.</div>' +
          '<div class="head-actions"><button class="btn primary" data-act="add-catalog">' + icon('plus') + '<span>Добавить позицию</span></button>' +
          '<button class="btn" data-act="import-catalog">Импорт из Excel</button>' +
          (state.items.length ? '<button class="btn" data-act="catalog-from-stock">Заполнить из номенклатуры</button>' : '') +
          '</div></div>';
    } else {
      emptyEl.innerHTML = '';
      body.innerHTML = list.map(function (c) {
        return '<tr>' +
          '<td><div class="cell-name">' + esc(c.name) + '</div></td>' +
          '<td class="muted">' + (c.sku ? esc(c.sku) : '<span class="cell-empty">—</span>') + '</td>' +
          '<td class="r">' + fmtMoney(c.price) + '</td>' +
          '<td class="r"><div class="catalog-actions">' +
          '<button class="btn small accent" data-act="catalog-to-stock" data-id="' + c.id + '">На склад</button>' +
          '<button class="icon-btn" data-act="edit-catalog" data-id="' + c.id + '" title="Изменить">' + icon('pencil') + '</button>' +
          '<button class="icon-btn danger" data-act="del-catalog" data-id="' + c.id + '" title="Удалить">' + icon('trash') + '</button>' +
          '</div></td></tr>';
      }).join('');
      foundEl.textContent = query ? 'Найдено: ' + list.length + ' из ' + all.length : 'Всего: ' + all.length;
    }

    const prices = all.map(function (c) { return toNum(c.price); });
    const avg = prices.length ? prices.reduce(function (s, p) { return s + p; }, 0) / prices.length : 0;
    const onStock = all.filter(function (c) { return !!findStockItem(c); }).length;
    $('#catalog-kpis').innerHTML = kpiCards([
      { label: 'Позиций в каталоге', value: all.length, sub: 'в прайс-листе' },
      { label: 'Средняя цена', value: money(avg), sub: 'по каталогу' },
      { label: 'Добавлено на склад', value: onStock, sub: 'позиций' },
      { label: 'Не добавлено', value: all.length - onStock, sub: 'можно добавить' },
    ]);
  }

  function openCatalogModal(id) {
    const item = id ? state.catalog.find(function (c) { return c.id === id; }) : null;
    showModal(
      '<form id="catalog-form" novalidate>' +
      '<div class="modal-head"><h3>' + (item ? 'Изменить позицию каталога' : 'Новая позиция каталога') + '</h3>' +
      '<button type="button" class="icon-btn" data-close>' + icon('x') + '</button></div>' +
      '<label class="field"><span>Наименование <em>*</em></span>' +
      '<input name="name" maxlength="200" autocomplete="off" placeholder="Например, Кабель ВВГнг(А)-LS 3×2,5" value="' + esc(item ? item.name : '') + '"></label>' +
      '<div class="form-row">' +
      '<label class="field"><span>Артикул</span><input name="sku" maxlength="60" autocomplete="off" value="' + esc(item ? item.sku : '') + '"></label>' +
      '<label class="field"><span>Цена, \u20bd <em>*</em></span><input name="price" inputmode="decimal" autocomplete="off" placeholder="0,00" value="' + (item ? fmtNumInput(item.price) : '') + '"></label>' +
      '</div>' +
      '<div class="modal-actions"><button type="button" class="btn" data-close>Отмена</button>' +
      '<button type="submit" class="btn primary">Сохранить</button></div></form>',
      {
        onMount: function (modal, close) {
          const form = modal.querySelector('#catalog-form');
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            const name = form.elements.name.value.trim();
            const priceRaw = form.elements.price.value.trim();
            if (!name) {
              toast('Укажите наименование', 'error');
              form.elements.name.focus();
              return;
            }
            if (priceRaw === '') {
              toast('Укажите цену', 'error');
              form.elements.price.focus();
              return;
            }
            const data = {
              name: name,
              sku: form.elements.sku.value.trim(),
              price: round2(toNum(priceRaw)),
            };
            if (item) Object.assign(item, data);
            else state.catalog.push(Object.assign({ id: uid() }, data));
            saveState();
            close();
            renderApp();
            toast(item ? 'Позиция каталога обновлена' : 'Позиция добавлена в каталог');
          });
        },
      }
    );
  }

  async function removeCatalogItem(id) {
    const item = state.catalog.find(function (c) { return c.id === id; });
    if (!item) return;
    const ok = await confirmDialog('Удалить позицию каталога?', '«' + item.name + '» будет удалена из каталога. На складе ничего не изменится.', 'Удалить');
    if (!ok) return;
    state.catalog = state.catalog.filter(function (c) { return c.id !== id; });
    saveState();
    renderApp();
    toast('Позиция удалена из каталога');
  }

  function fillCatalogFromStock() {
    if (!state.items.length) {
      toast('Номенклатура пуста — добавлять в каталог нечего', 'error');
      return;
    }
    const missing = state.items.filter(function (it) {
      return !state.catalog.some(function (c) {
        if (c.sku && it.sku && c.sku.toLowerCase() === it.sku.toLowerCase()) return true;
        return c.name.toLowerCase() === it.name.toLowerCase();
      });
    });
    if (!missing.length) {
      toast('Все позиции номенклатуры уже в каталоге');
      return;
    }
    missing.forEach(function (it) {
      state.catalog.push({ id: uid(), name: it.name, sku: it.sku, price: round2(it.price) });
    });
    saveState();
    renderApp();
    toast('Добавлено в каталог: ' + missing.length);
  }

  function openStockAddModal(catId) {
    const cat = state.catalog.find(function (c) { return c.id === catId; });
    if (!cat) return;
    const match = findStockItem(cat);
    showModal(
      '<form id="stock-add-form" novalidate>' +
      '<div class="modal-head"><h3>Добавить на склад</h3>' +
      '<button type="button" class="icon-btn" data-close>' + icon('x') + '</button></div>' +
      '<div class="catalog-preview">' +
      '<div class="catalog-preview-name">' + esc(cat.name) + '</div>' +
      '<div class="muted">' + (cat.sku ? esc(cat.sku) + ' · ' : '') + 'цена ' + money(cat.price) + '</div>' +
      '</div>' +
      '<div class="form-row">' +
      '<label class="field"><span>Количество <em>*</em></span><input id="stock-add-qty" inputmode="decimal" autocomplete="off" value="1"></label>' +
      '<label class="field"><span>Ед. изм.</span><input id="stock-add-unit" list="units" autocomplete="off" value="' + esc(match ? match.unit : 'шт') + '"></label>' +
      '</div>' +
      '<label class="field"><span>Цена закупки, \u20bd</span><input id="stock-add-price" inputmode="decimal" autocomplete="off" value="' + fmtNumInput(cat.price) + '"></label>' +
      '<div class="hint">' + (match
        ? 'Позиция уже на складе: ' + fmtQty(match.qty) + ' ' + esc(match.unit) + '. Количество будет увеличено.'
        : 'Будет создана новая позиция в номенклатуре.') + '</div>' +
      '<div class="modal-actions"><button type="button" class="btn" data-close>Отмена</button>' +
      '<button type="submit" class="btn primary">Добавить на склад</button></div></form>',
      {
        onMount: function (modal, close) {
          const form = modal.querySelector('#stock-add-form');
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            const qtyInput = form.querySelector('#stock-add-qty');
            const unitInput = form.querySelector('#stock-add-unit');
            const priceInput = form.querySelector('#stock-add-price');
            const qty = round3(toNum(qtyInput.value));
            if (!(qty > 0)) {
              toast('Укажите количество больше нуля', 'error');
              qtyInput.focus();
              return;
            }
            if (priceInput.value.trim() === '') {
              toast('Укажите цену', 'error');
              priceInput.focus();
              return;
            }
            const unit = unitInput.value.trim() || 'шт';
            const price = round2(toNum(priceInput.value));
            const current = findStockItem(cat);
            if (current) {
              current.qty = round3(toNum(current.qty) + qty);
              current.price = price;
              current.unit = unit;
              if (!current.sku && cat.sku) current.sku = cat.sku;
            } else {
              state.items.push({ id: uid(), name: cat.name, sku: cat.sku, unit: unit, price: price, qty: qty });
            }
            saveState();
            close();
            renderApp();
            toast('На склад добавлено: ' + fmtQty(qty) + ' ' + unit);
          });
        },
      }
    );
  }

  function exportCatalog() {
    if (!state.catalog.length) {
      toast('Каталог пуст', 'error');
      return;
    }
    const rows = [];
    const heights = [];
    const merges = [];
    const addRow = function (cells, h) { rows.push(cells); heights.push(h || 0); return rows.length; };

    const r1 = addRow([{ v: 'Каталог номенклатуры', s: S.title }], 26);
    const r2 = addRow([{ v: 'Сформировано: ' + nowRu(), s: S.subtitle }], 18);
    addRow([]);
    addRow(['№', 'Наименование', 'Артикул', 'Цена'].map(function (h) { return { v: h, s: S.header }; }), 30);
    merges.push('A' + r1 + ':D' + r1, 'A' + r2 + ':D' + r2);

    state.catalog.forEach(function (c, i) {
      addRow([
        { v: i + 1, s: S.center },
        { v: c.name, s: S.text },
        { v: c.sku, s: S.text },
        { v: round2(c.price), s: S.money },
      ]);
    });

    addRow([]);
    const tr = addRow([{ v: 'Всего позиций: ' + state.catalog.length, s: S.totalLabel }], 22);
    merges.push('A' + tr + ':D' + tr);

    const bytes = XLSX.build({
      sheets: [{
        name: 'Каталог',
        cols: [5, 48, 18, 14],
        rows: rows,
        heights: heights,
        merges: merges,
        freeze: 4,
      }],
    });
    downloadXlsx(bytes, 'Каталог_' + todayISO() + '.xlsx');
    toast('Каталог выгружен в Excel');
  }

      : state.items;

    const countEl = $('#pick-count');
    if (countEl) countEl.textContent = count ? 'выбрано: ' + count : 'ничего не выбрано';

        '<div class="head-actions"><button class="btn small" data-go="items">Перейти в номенклатуру</button></div></div>';

  async function saveInvoice() {
    const inv = draftToInvoice();
    if (!inv.lines.length) {
      toast('Выберите хотя бы одну позицию', 'error');
      return;
    }
    if (!inv.date) {
      toast('Укажите дату счёта', 'error');
      return;
    }
    if (!inv.number) inv.number = String(state.settings.nextNumber);

    const deduct = !!ui.draft.deduct;
    if (deduct) {
      const shortage = inv.lines.filter(function (line) {
        const item = state.items.find(function (x) { return x.id === line.itemId; });
        return item && toNum(item.qty) < line.qty;
      });
      if (shortage.length) {
        const names = shortage.slice(0, 3).map(function (l) { return l.name; }).join(', ');
        const ok = await confirmDialog(
          'Недостаточно остатка',
          'На складе меньше, чем указано в счёте: ' + names + (shortage.length > 3 ? ' и др.' : '') + '. Сохранить счёт и уйти в минус?',
          'Сохранить',
          false
        );
        if (!ok) return;
      }
    }

    const record = Object.assign({}, inv, {
      id: uid(),
      createdAt: new Date().toISOString(),
      deducted: deduct,
    });

    if (deduct) {
      record.lines.forEach(function (line) {
        const item = state.items.find(function (x) { return x.id === line.itemId; });
        if (item) item.qty = round3(toNum(item.qty) - line.qty);
      });
    }

    state.invoices.unshift(record);

    const n = parseInt(String(record.number).replace(/\D/g, ''), 10);
    if (Number.isFinite(n) && n >= state.settings.nextNumber) state.settings.nextNumber = n + 1;

    saveState();
    ui.viewInvoice = record;
    ui.draft = newDraft();
    ui.pickSearch = '';
    renderApp();

  /* ------------------------------ import ------------------------------ */

  function colIndexFromRef(ref) {
    let n = 0;
    for (let i = 0; i < ref.length; i++) {
      const ch = ref.charCodeAt(i);
      if (ch >= 65 && ch <= 90) n = n * 26 + (ch - 64);
      else if (ch >= 97 && ch <= 122) n = n * 26 + (ch - 96);
    }
    return n - 1;
  }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('Браузер не поддерживает чтение .xlsx. Сохраните файл как CSV и попробуйте снова.');
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzipEntries(bytes) {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    const min = Math.max(0, bytes.length - 65557);
    for (let i = bytes.length - 22; i >= min; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Файл не похож на Excel (.xlsx)');
    const total = view.getUint16(eocd + 10, true);
    let p = view.getUint32(eocd + 16, true);
    const files = {};
    for (let i = 0; i < total; i++) {
      if (p + 46 > bytes.length || view.getUint32(p, true) !== 0x02014b50) break;
      const flags = view.getUint16(p + 8, true);
      if (flags & 1) throw new Error('Файл защищён паролем и не может быть прочитан');
      const method = view.getUint16(p + 10, true);
      const compSize = view.getUint32(p + 20, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const localOffset = view.getUint32(p + 42, true);
      const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
      const lNameLen = view.getUint16(localOffset + 26, true);
      const lExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + lNameLen + lExtraLen;
      files[name] = { method: method, data: bytes.subarray(dataStart, dataStart + compSize) };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return files;
  }

  async function readZipEntry(entry) {
    if (!entry) throw new Error('В файле отсутствуют нужные данные');
    if (entry.method === 0) return entry.data;
    if (entry.method === 8) return inflateRaw(entry.data);
    throw new Error('Неподдерживаемый способ сжатия в файле');
  }

  function parseXmlBytes(bytes) {
    const text = new TextDecoder('utf-8').decode(bytes);
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('Не удалось прочитать XML внутри файла');
    return doc;
  }

  function readSharedStrings(doc) {
    return Array.from(doc.getElementsByTagName('si')).map(function (si) {
      return Array.from(si.getElementsByTagName('t')).map(function (t) { return t.textContent || ''; }).join('');
    });
  }

  function readSheetRows(doc, shared) {
    const rows = [];
    Array.from(doc.getElementsByTagName('row')).forEach(function (rowEl) {
      const r = parseInt(rowEl.getAttribute('r'), 10);
      const rowIndex = Number.isFinite(r) ? r - 1 : rows.length;
      const cells = [];
      Array.from(rowEl.getElementsByTagName('c')).forEach(function (c) {
        const ref = c.getAttribute('r') || '';
        const col = ref ? colIndexFromRef(ref.replace(/\d+/g, '')) : cells.length;
        const type = c.getAttribute('t');
        let value = '';
        if (type === 's') {
          const v = c.getElementsByTagName('v')[0];
          const idx = v ? parseInt(v.textContent, 10) : -1;
          value = shared[idx] != null ? shared[idx] : '';
        } else if (type === 'inlineStr') {
          value = Array.from(c.getElementsByTagName('t')).map(function (t) { return t.textContent || ''; }).join('');
        } else {
          const v = c.getElementsByTagName('v')[0];
          value = v ? v.textContent || '' : '';
        }
        cells[col] = value;
      });
      rows[rowIndex] = cells;
    });
    return rows;
  }

  async function readXlsxRows(bytes) {
    const files = await unzipEntries(bytes);
    if (!files['xl/workbook.xml']) throw new Error('Файл не похож на Excel (.xlsx)');
    const wb = parseXmlBytes(await readZipEntry(files['xl/workbook.xml']));
    const sheets = wb.getElementsByTagName('sheet');
    if (!sheets.length) throw new Error('В файле нет листов');
    const first = sheets[0];
    const relId = first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let sheetPath = 'xl/worksheets/sheet1.xml';
    const relsEntry = files['xl/_rels/workbook.xml.rels'];
    if (relId && relsEntry) {
      const relsDoc = parseXmlBytes(await readZipEntry(relsEntry));
      const rels = Array.from(relsDoc.getElementsByTagName('Relationship'));
      const rel = rels.find(function (x) { return x.getAttribute('Id') === relId; });
      if (rel) {
        let target = String(rel.getAttribute('Target') || '').replace(/^\/+/, '');
        if (target.indexOf('xl/') !== 0) target = 'xl/' + target;
        if (files[target]) sheetPath = target;
      }
    }
    if (!files[sheetPath]) {
      const alt = Object.keys(files).find(function (n) {
        return n.indexOf('xl/worksheets/') === 0 && /\.xml$/i.test(n);
      });
      if (alt) sheetPath = alt;
      else throw new Error('Не удалось найти лист с данными');
    }
    const sheet = parseXmlBytes(await readZipEntry(files[sheetPath]));
    let shared = [];
    if (files['xl/sharedStrings.xml']) {
      shared = readSharedStrings(parseXmlBytes(await readZipEntry(files['xl/sharedStrings.xml'])));
    }
    return readSheetRows(sheet, shared);
  }

  function parseCsv(text, delim) {
    const rows = [];
    let row = [];
    let field = '';
    let quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else {
          field += ch;
        }
      } else if (ch === '"') {
        quoted = true;
      } else if (ch === delim) {
        row.push(field);
        field = '';
      } else if (ch === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else if (ch !== '\r') {
        field += ch;
      }
    }
    if (field !== '' || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  async function readCsvRows(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let text;
    if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
      text = new TextDecoder('utf-8').decode(bytes.subarray(3));
    } else {
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (err) {
        text = new TextDecoder('windows-1251').decode(bytes);
      }
    }
    const sample = text.split(/\r?\n/).slice(0, 8).join('\n');
    const semicolons = (sample.match(/;/g) || []).length;
    const commas = (sample.match(/,/g) || []).length;
    const tabs = (sample.match(/\t/g) || []).length;
    let delim = ';';
    if (tabs > semicolons && tabs >= commas) delim = '\t';
    else if (commas > semicolons && commas > tabs) delim = ',';
    return parseCsv(text, delim);
  }

  function rowsToItems(rows) {
    const norm = function (value) {
      return String(value == null ? '' : value)
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase()
        .replace(/ё/g, 'е');
    };

    let headerRow = -1;
    let cols = null;
    for (let i = 0; i < Math.min(rows.length, 40); i++) {
      const texts = Array.from(rows[i] || [], norm);
      const nameCol = texts.findIndex(function (t) {
        return t.indexOf('наимен') === 0 || t === 'название' || t === 'товар' || t === 'name';
      });
      if (nameCol === -1) continue;
      const priceCol = texts.findIndex(function (t) {
        const isPrice = t.indexOf('цена') === 0 || t.indexOf('стоимост') === 0 || t === 'price';
        const isExtra = t.indexOf('нацен') !== -1 || t.indexOf('услуг') !== -1 || t.indexOf('сумм') !== -1 || t.indexOf('итог') !== -1;
        return isPrice && !isExtra;
      });
      const qtyCol = texts.findIndex(function (t) {
        return t.indexOf('колич') === 0 || t.indexOf('кол-во') === 0 || t === 'остаток' || t === 'qty';
      });
      const skuCol = texts.findIndex(function (t) {
        return t.indexOf('артикул') === 0 || t === 'код' || t === 'sku';
      });
      const unitCol = texts.findIndex(function (t) {
        return t.indexOf('ед') === 0 || t.indexOf('единиц') === 0 || t === 'unit';
      });
      headerRow = i;
      cols = { name: nameCol, price: priceCol, qty: qtyCol, sku: skuCol, unit: unitCol };
      break;
    }

    if (!cols) {
      throw new Error('Не найдена колонка «Наименование». Скачайте шаблон и заполните его.');
    }

    const items = [];
    for (let i = headerRow + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      const name = String(row[cols.name] == null ? '' : row[cols.name]).trim();
      if (!name) continue;
      if (/^(итого|всего)\b/i.test(name)) continue;
      items.push({
        id: uid(),
        name: name,
        sku: cols.sku >= 0 ? String(row[cols.sku] == null ? '' : row[cols.sku]).trim() : '',
        unit: (cols.unit >= 0 ? String(row[cols.unit] == null ? '' : row[cols.unit]).trim() : '') || 'шт',
        price: round2(cols.price >= 0 ? toNum(row[cols.price]) : 0),
        qty: round3(cols.qty >= 0 ? toNum(row[cols.qty]) : 0),
      });
    }
    return items;
  }

  async function parseImportFile(file) {
    if (!file) throw new Error('Файл не выбран');
    if (file.size > 10 * 1024 * 1024) throw new Error('Файл слишком большой (максимум 10 МБ)');
    const name = String(file.name || '').toLowerCase();
    let rows;
    if (name.slice(-5) === '.xlsx' || name.slice(-5) === '.xlsm') {
      rows = await readXlsxRows(new Uint8Array(await file.arrayBuffer()));
    } else if (name.slice(-4) === '.csv' || name.slice(-4) === '.txt') {
      rows = await readCsvRows(file);
    } else {
      throw new Error('Поддерживаются файлы .xlsx и .csv. Полную копию базы (JSON) загрузите в настройках.');
    }
    return rowsToItems(rows);
  }

  function mergeCatalog(parsed) {
    const keyOf = function (c) {
      const sku = String(c.sku || '').trim().toLowerCase();
      if (sku) return 'sku:' + sku;
      return 'name:' + String(c.name || '').trim().toLowerCase();
    };
    const byKey = new Map();
    (state.catalog || []).forEach(function (c) { byKey.set(keyOf(c), c); });
    parsed.forEach(function (c) {
      const key = keyOf(c);
      const existing = byKey.get(key);
      if (existing) {
        existing.name = c.name;
        if (c.sku) existing.sku = c.sku;
        existing.price = round2(c.price);
      } else {
        const item = { id: uid(), name: c.name, sku: c.sku, price: round2(c.price) };
        state.catalog.push(item);
        byKey.set(key, item);
      }
    });
  }
