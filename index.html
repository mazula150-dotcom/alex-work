  /* ------------------------------ cloud ------------------------------ */

  function defaultCloud() {
    return {
      clientId: '',
      accessToken: '',
      refreshToken: '',
      expiresAt: 0,
      lastSyncAt: 0,
      lastRemoteUpdatedAt: '',
      lastRemoteMd5: '',
      conflictPending: false,
      localDirty: false,
      localUpdatedAt: '',
      deviceId: 'dev' + Math.random().toString(36).slice(2, 10),
      auto: true,
      lastError: '',
    };
  }

  function loadCloud() {
    try {
      const raw = localStorage.getItem(CLOUD_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        return Object.assign(defaultCloud(), data && typeof data === 'object' ? data : {});
      }
    } catch (err) { /* ignore */ }
    return defaultCloud();
  }

  function saveCloud() {
    try { localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); } catch (err) { /* ignore */ }
  }

  function cloudConnected() {
    return !!(cloud && (cloud.accessToken || cloud.refreshToken));
  }

  function cloudLocalChanged() {
    if (!cloud) return false;
    if (cloud.localDirty) return true;
    if (!cloud.localUpdatedAt) return false;
    return new Date(cloud.localUpdatedAt).getTime() > (cloud.lastSyncAt || 0);
  }

  function b64url(bytes) {
    let text = '';
    for (let i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
    return btoa(text).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function randomB64(length) {
    const bytes = new Uint8Array(length);
    crypto.getRandomValues(bytes);
    return b64url(bytes);
  }

  async function pkceChallenge(verifier) {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return b64url(new Uint8Array(digest));
  }

  function fmtDateTime(value) {
    if (!value) return '—';
    const d = value instanceof Date ? value : new Date(value);
    if (isNaN(d.getTime())) return '—';
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return ruDate(iso) + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  async function cloudConnect(rawClientId) {
    if (location.protocol === 'file:') {
      toast('Облако работает только на HTTPS-адресе. Разместите файл на хостинге.', 'error');
      return;
    }
    if (!crypto || !crypto.subtle) {
      toast('Браузер не поддерживает безопасную авторизацию', 'error');
      return;
    }
    const clientId = String(rawClientId || '').trim();
    if (!clientId) {
      toast('Укажите ClientID приложения', 'error');
      return;
    }
    cloud.clientId = clientId;
    if (!cloud.localUpdatedAt) cloud.localUpdatedAt = new Date().toISOString();
    cloud.lastError = '';
    saveCloud();

    const verifier = randomB64(48);
    const challenge = await pkceChallenge(verifier);
    const stateToken = randomB64(16);
    const redirectUri = location.origin + location.pathname;
    try {
      sessionStorage.setItem('nomenklatura.oauth', JSON.stringify({
        verifier: verifier,
        state: stateToken,
        redirectUri: redirectUri,
        ts: Date.now(),
      }));
    } catch (err) {
      toast('Браузер блокирует сессию — авторизация невозможна', 'error');
      return;
    }
    const params = new URLSearchParams({
      response_type: 'code',
      client_id: clientId,
      redirect_uri: redirectUri,
      scope: CLOUD_SCOPE,
      code_challenge: challenge,
      code_challenge_method: 'S256',
      state: stateToken,
    });
    location.href = CLOUD_AUTH + '?' + params.toString();
  }

  async function cloudHandleCallback() {
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const error = params.get('error');
    if (!code && !error) return false;

    let saved = null;
    try {
      saved = JSON.parse(sessionStorage.getItem('nomenklatura.oauth') || 'null');
      sessionStorage.removeItem('nomenklatura.oauth');
    } catch (err) { /* ignore */ }
    try {
      history.replaceState(null, '', location.pathname + location.hash);
    } catch (err) { /* ignore */ }

    if (error) {
      toast('Доступ к Яндекс Диску не предоставлен', 'error');
      return true;
    }
    if (!saved || saved.state !== params.get('state')) {
      toast('Ошибка авторизации. Проверьте Redirect URI в приложении Яндекса.', 'error');
      return true;
    }
    try {
      const body = new URLSearchParams({
        grant_type: 'authorization_code',
        code: code,
        client_id: cloud.clientId,
        redirect_uri: saved.redirectUri,
        code_verifier: saved.verifier,
      });
      const res = await fetch(CLOUD_TOKEN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
      });
      const data = await res.json();
      if (!res.ok || !data.access_token) throw new Error(data.error_description || data.error || 'Токен не получен');
      cloud.accessToken = data.access_token;
      cloud.refreshToken = data.refresh_token || '';
      cloud.expiresAt = Date.now() + (data.expires_in ? data.expires_in * 1000 : 3600 * 1000);
      cloud.lastError = '';
      saveCloud();
      toast('Яндекс Диск подключён');
      renderApp();
      updateCloudBadge();
      await cloudSync('connect');
    } catch (err) {
      cloud.lastError = err && err.message ? err.message : String(err);
      saveCloud();
      updateCloudBadge();
      toast('Ошибка подключения: ' + cloud.lastError, 'error');
    }
    return true;
  }

  async function cloudToken() {
    if (cloud.accessToken && cloud.expiresAt > Date.now() + 60000) return cloud.accessToken;
    if (!cloud.refreshToken) throw new Error('Нет доступа. Подключите Диск заново.');
    const body = new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: cloud.refreshToken,
      client_id: cloud.clientId,
    });
    const res = await fetch(CLOUD_TOKEN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
    });
    const data = await res.json();
    if (!res.ok || !data.access_token) {
      cloud.accessToken = '';
      cloud.refreshToken = '';
      saveCloud();
      throw new Error('Сессия истекла. Подключите Диск заново.');
    }
    cloud.accessToken = data.access_token;
    if (data.refresh_token) cloud.refreshToken = data.refresh_token;
    cloud.expiresAt = Date.now() + (data.expires_in ? data.expires_in * 1000 : 3600 * 1000);
    saveCloud();
    return cloud.accessToken;
  }

  async function cloudFetch(path, options) {
    const token = await cloudToken();
    const headers = Object.assign(
      { Authorization: 'OAuth ' + token, Accept: 'application/json' },
      (options && options.headers) || {}
    );
    return fetch(CLOUD_API + path, Object.assign({}, options || {}, { headers: headers }));
  }

  async function cloudErrorText(res) {
    try {
      const data = await res.json();
      return data.message || data.description || data.error || ('HTTP ' + res.status);
    } catch (err) {
      return 'HTTP ' + res.status;
    }
  }

  async function cloudMeta() {
    const res = await cloudFetch('/resources?path=' + encodeURIComponent(CLOUD_FILE) + '&fields=modified,size,md5');
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(await cloudErrorText(res));
    return res.json();
  }

  async function cloudDownload() {
    const res = await cloudFetch('/resources/download?path=' + encodeURIComponent(CLOUD_FILE));
    if (!res.ok) throw new Error('Не удалось получить файл с Диска: ' + (await cloudErrorText(res)));
    const data = await res.json();
    const file = await fetch(data.href, { referrerPolicy: 'no-referrer' });
    if (!file.ok) throw new Error('Не удалось скачать файл с Диска');
    return file.json();
  }

  async function cloudEnsureFolder() {
    const folderPath = encodeURIComponent('app:/');
    const info = await cloudFetch('/resources?path=' + folderPath);
    if (info.ok) return;
    if (info.status === 404) {
      const created = await cloudFetch('/resources?path=' + folderPath, { method: 'PUT' });
      if (created.ok || created.status === 409) return;
      throw new Error('Не удалось создать папку приложения на Диске. В OAuth-приложении включите доступ «К папке приложения на Яндекс Диске» (cloud_api:disk.app_folder) и переподключите Диск.');
    }
    if (info.status === 401) throw new Error('Сессия истекла. Отключите и подключите Диск заново.');
    throw new Error('Папка приложения на Диске недоступна: ' + (await cloudErrorText(info)) + '. Проверьте доступ «К папке приложения на Яндекс Диске» и переподключите Диск.');
  }

  async function cloudUpload(payload) {
    await cloudEnsureFolder();
    const res = await cloudFetch('/resources/upload?path=' + encodeURIComponent(CLOUD_FILE) + '&overwrite=true');
    if (!res.ok) throw new Error('Не удалось получить ссылку для загрузки: ' + (await cloudErrorText(res)));
    const data = await res.json();
    const put = await fetch(data.href, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload, null, 2),
      referrerPolicy: 'no-referrer',
    });
    if (!put.ok) throw new Error('Не удалось загрузить файл на Диск (HTTP ' + put.status + ')');
  }

  function cloudPayload() {
    if (!cloud.localUpdatedAt) cloud.localUpdatedAt = new Date().toISOString();
    return {
      app: 'nomenklatura',
      version: 2,
      updatedAt: cloud.localUpdatedAt,
      deviceId: cloud.deviceId,
      company: state.company,
      settings: state.settings,
      items: state.items,
      catalog: state.catalog,
      invoices: state.invoices,
    };
  }

  function applyCloudPayload(payload) {
    state = normalize(payload);
    if (ui.draft) ui.draft.lines = {};
    ui.viewInvoice = null;
    cloud.localUpdatedAt = payload.updatedAt || new Date().toISOString();
    cloud.lastRemoteUpdatedAt = cloud.localUpdatedAt;
    cloud.localDirty = false;
    saveCloud();
    saveState(true);
    renderApp();
  }

  function cloudConflict(remote) {
    return new Promise(function (resolve) {
      let done = false;
      const finish = function (value) {
        if (done) return;
        done = true;
        resolve(value);
      };
      showModal(
        '<div class="modal-head"><h3>Конфликт версий</h3>' +
        '<button type="button" class="icon-btn" data-close>' + icon('x') + '</button></div>' +
        '<p class="modal-sub">База менялась и на этом устройстве, и на Яндекс Диске. Выберите, какую версию оставить.</p>' +
        '<div class="cloud-versions">' +
        '<div><span>На Диске</span><b>' + fmtDateTime(remote.updatedAt) + '</b></div>' +
        '<div><span>На этом устройстве</span><b>' + fmtDateTime(cloud.localUpdatedAt) + '</b></div>' +
        '</div>' +
        '<div class="modal-actions">' +
        '<button type="button" class="btn" data-close>Отмена</button>' +
        '<button type="button" class="btn" id="cf-pull">Скачать с Диска</button>' +
        '<button type="button" class="btn primary" id="cf-push">Загрузить на Диск</button>' +
        '</div>',
        {
          onMount: function (modal, close) {
            modal.querySelector('#cf-pull').addEventListener('click', function () { finish('pull'); close(); });
            modal.querySelector('#cf-push').addEventListener('click', function () { finish('push'); close(); });
          },
          onClose: function () { finish(null); },
        }
      );
    });
  }

  async function cloudRememberUploaded() {
    try {
      const meta = await cloudMeta();
      cloud.lastRemoteMd5 = meta && meta.md5 ? String(meta.md5) : '';
    } catch (err) {
      cloud.lastRemoteMd5 = '';
    }
  }

  async function cloudSync(reason) {
    if (!cloudConnected()) {
      if (reason === 'manual') toast('Сначала подключите Яндекс Диск', 'error');
      return;
    }
    if (reason === 'manual') cloud.conflictPending = false;
    if (reason === 'auto' && cloud.conflictPending) return;
    if (cloudBusy) return;
    cloudBusy = true;
    setSyncBusy(true);
    cloud.lastError = '';
    saveCloud();
    updateCloudBadge();
    renderCloudStatus();

    try {
      const meta = await cloudMeta();
      if (!meta) {
        const payload = cloudPayload();
        await cloudUpload(payload);
        await cloudRememberUploaded();
        cloud.lastSyncAt = Date.now();
        cloud.lastRemoteUpdatedAt = payload.updatedAt;
        cloud.conflictPending = false;
        cloud.localDirty = false;
        saveCloud();
        if (reason !== 'auto') toast('База загружена на Яндекс Диск');
        return;
      }

      const remoteMd5 = String(meta.md5 || '');
      const remoteChanged = remoteMd5 !== String(cloud.lastRemoteMd5 || '');
      const localEmpty = !state.items.length && !state.catalog.length && !state.invoices.length;
      const localChanged = cloudLocalChanged();

      if (!remoteChanged && !localChanged) {
        cloud.lastSyncAt = Date.now();
        cloud.lastRemoteMd5 = remoteMd5;
        cloud.localDirty = false;
        saveCloud();
        if (reason === 'manual') toast('Всё синхронизировано');
        return;
      }

      if (!remoteChanged && localChanged) {
        const payload = cloudPayload();
        await cloudUpload(payload);
        await cloudRememberUploaded();
        cloud.lastSyncAt = Date.now();
        cloud.lastRemoteUpdatedAt = payload.updatedAt;
        cloud.conflictPending = false;
        cloud.localDirty = false;
        saveCloud();
        if (reason !== 'auto') toast('Изменения загружены на Яндекс Диск');
        return;
      }

      const remote = await cloudDownload();
      const remoteUpdated = String(remote.updatedAt || '');

      if (!cloud.lastSyncAt && localEmpty) {
        applyCloudPayload(remote);
        cloud.lastSyncAt = Date.now();
        cloud.lastRemoteUpdatedAt = remoteUpdated;
        cloud.lastRemoteMd5 = remoteMd5;
        cloud.conflictPending = false;
        cloud.localDirty = false;
        saveCloud();
        toast('База загружена с Яндекс Диска');
        return;
      }

      if (localChanged) {
        const choice = await cloudConflict(remote);
        if (choice === 'pull') {
          applyCloudPayload(remote);
          cloud.lastSyncAt = Date.now();
          cloud.lastRemoteUpdatedAt = remoteUpdated;
          cloud.lastRemoteMd5 = remoteMd5;
          cloud.conflictPending = false;
          cloud.localDirty = false;
          saveCloud();
          toast('Загружена версия с Яндекс Диска');
        } else if (choice === 'push') {
          const payload = cloudPayload();
          await cloudUpload(payload);
          await cloudRememberUploaded();
          cloud.lastSyncAt = Date.now();
          cloud.lastRemoteUpdatedAt = payload.updatedAt;
          cloud.conflictPending = false;
          cloud.localDirty = false;
          saveCloud();
          toast('Версия с этого устройства загружена на Диск');
        } else {
          cloud.conflictPending = true;
          saveCloud();
        }
        return;
      }

      applyCloudPayload(remote);
      cloud.lastSyncAt = Date.now();
      cloud.lastRemoteUpdatedAt = remoteUpdated;
      cloud.lastRemoteMd5 = remoteMd5;
      cloud.conflictPending = false;
      cloud.localDirty = false;
      saveCloud();
      toast('Получены изменения с Яндекс Диска');
    } catch (err) {
      cloud.lastError = err && err.message ? err.message : String(err);
      saveCloud();
      if (reason === 'manual') toast('Ошибка синхронизации: ' + cloud.lastError, 'error');
    } finally {
      cloudBusy = false;
      setSyncBusy(false);
      saveCloud();
      updateCloudBadge();
      renderCloudStatus();
    }
  }

  function cloudStatusHtml() {
    if (!cloudConnected()) return '<span class="status out">Не подключено</span>';
    if (cloudBusy) return '<span class="status low">Синхронизация…</span>';
    if (cloud.lastError) return '<span class="status zero">Ошибка: ' + esc(cloud.lastError) + '</span>';
    if (!cloud.lastSyncAt) return '<span class="status low">Подключено, ожидает первой синхронизации</span>';
    if (cloudLocalChanged()) return '<span class="status low">Есть несинхронизированные изменения</span>';
    return '<span class="status in">Синхронизировано ' + fmtDateTime(cloud.lastSyncAt) + '</span>';
  }

  function cloudLastText() {
    if (!cloud.lastSyncAt) return 'Последняя синхронизация: ещё не было';
    return 'Последняя синхронизация: ' + fmtDateTime(cloud.lastSyncAt) + ' · файл ' + CLOUD_FILE;
  }

  function renderCloudStatus() {
    const status = $('#cloud-status');
    if (status) status.innerHTML = cloudStatusHtml();
    const last = $('#cloud-last');
    if (last) last.textContent = cloudLastText();
  }

  function updateCloudBadge() {
    const btn = $('#btn-cloud');
    const syncBtn = $('#btn-sync');
    if (syncBtn) {
      syncBtn.classList.toggle('off', !cloudConnected());
      syncBtn.title = cloudConnected() ? 'Синхронизировать с Яндекс Диском' : 'Синхронизировать (облако не подключено)';
    }
    if (!btn) return;
    btn.classList.remove('on', 'pending', 'error', 'off');
    if (!cloudConnected()) {
      btn.classList.add('off');
      btn.title = 'Облако не подключено';
      return;
    }
    if (cloud.lastError) {
      btn.classList.add('error');
      btn.title = 'Облако: ошибка синхронизации';
      return;
    }
    if (!cloud.lastSyncAt || cloudLocalChanged()) {
      btn.classList.add('pending');
      btn.title = 'Облако: есть изменения для синхронизации';
      return;
    }
    btn.classList.add('on');
    btn.title = 'Облако: синхронизировано ' + fmtDateTime(cloud.lastSyncAt);
  }

  function cloudAutoCheck() {
    if (!cloudConnected() || !cloud.auto || cloudBusy) return;
    if (Date.now() - (cloud.lastSyncAt || 0) < SYNC_INTERVAL) return;
    cloudSync('auto');
  }

  function cloudPoll() {
    if (!appReady || document.visibilityState !== 'visible') return;
    if (!cloudConnected() || !cloud.auto || cloudBusy || cloud.conflictPending) return;
    if (Date.now() - lastPollAt < 10000) return;
    lastPollAt = Date.now();
    cloudSync('auto');
  }

  function scheduleAutoSync() {
    if (!appReady || !cloudConnected() || !cloud.auto || cloudBusy || cloud.conflictPending) return;
    if (!cloud.lastSyncAt) return;
    if (autoSyncTimer) clearTimeout(autoSyncTimer);
    autoSyncTimer = setTimeout(function () {
      autoSyncTimer = 0;
      if (!cloudBusy) cloudSync('auto');
    }, 2500);
  }

  function setSyncBusy(on) {
    const btn = $('#btn-sync');
    if (btn) btn.classList.toggle('syncing', !!on);
  }

  function manualCloudSync() {
    if (!cloudConnected()) {
      openCloudModal();
      return;
    }
    cloudSync('manual');
  }

  function openCloudModal() {
    const connected = cloudConnected();
    const isFile = location.protocol === 'file:';
    const redirectUri = isFile ? '' : location.origin + location.pathname;

    showModal(
      '<div class="modal-head"><h3>Облако — Яндекс Диск</h3>' +
      '<button type="button" class="icon-btn" data-close>' + icon('x') + '</button></div>' +
      '<p class="modal-sub">База хранится в файле <b>' + CLOUD_FILE + '</b> в папке приложения на Диске. ' +
      'Проверка и обмен — при открытии, каждые 15 секунд и по кнопке.</p>' +
      (isFile
        ? '<div class="import-error">' + icon('alert', 15) + '<div>Облако работает только на HTTPS-адресе. ' +
          'Разместите файл на хостинге (Netlify, GitHub Pages) и откройте по ссылке — тогда синхронизация заработает и на телефоне.</div></div>'
        : '') +
      '<div class="cloud-status" id="cloud-status">' + cloudStatusHtml() + '</div>' +
      (connected
        ? '<div class="data-actions">' +
          '<button type="button" class="btn primary" id="cloud-sync">' + icon('refresh') + '<span>Синхронизировать</span></button>' +
          '<button type="button" class="btn danger-ghost" id="cloud-disconnect">Отключить</button>' +
          '</div>' +
          '<label class="check" style="margin-top:14px"><input type="checkbox" id="cloud-auto"' + (cloud.auto ? ' checked' : '') + '>' +
          '<span>Синхронизировать автоматически (каждые 15 секунд)</span></label>' +
          '<div class="hint" id="cloud-last">' + cloudLastText() + '</div>' +
          '<div class="hint" style="margin-top:10px">Токен хранится в этом браузере. На чужом устройстве отключайте облако.</div>'
        : '<label class="field"><span>ClientID приложения Яндекс OAuth</span>' +
          '<input id="cloud-client-id" autocomplete="off" placeholder="Вставьте ClientID" value="' + esc(cloud.clientId) + '"></label>' +
          '<div class="hint">Где взять: <a href="https://oauth.yandex.com/client/new/" target="_blank" rel="noopener">oauth.yandex.com/client/new</a> → ' +
          'платформа «Веб-сервисы» → Redirect URI: <code>' + esc(redirectUri || 'https://адрес-приложения/') + '</code> → ' +
          'доступ «К папке приложения на Яндекс Диске».</div>' +
          '<div class="data-actions" style="margin-top:12px">' +
          '<button type="button" class="btn primary" id="cloud-connect"' + (isFile ? ' disabled' : '') + '>' +
          icon('cloud') + '<span>Подключить Яндекс Диск</span></button>' +
          (redirectUri ? '<button type="button" class="btn" id="cloud-copy">Скопировать Redirect URI</button>' : '') +
          '</div>'),
      {
        onMount: function (modal, close) {
          const syncBtn = modal.querySelector('#cloud-sync');
          if (syncBtn) syncBtn.addEventListener('click', function () { manualCloudSync(); });

          const disconnect = modal.querySelector('#cloud-disconnect');
          if (disconnect) disconnect.addEventListener('click', function () {
            if (!window.confirm('Отключить Яндекс Диск? Данные останутся на этом устройстве.')) return;
            cloud.accessToken = '';
            cloud.refreshToken = '';
            cloud.expiresAt = 0;
            cloud.lastSyncAt = 0;
            cloud.lastRemoteUpdatedAt = '';
            cloud.lastError = '';
            saveCloud();
            updateCloudBadge();
            close();
            openCloudModal();
            toast('Яндекс Диск отключён');
          });

          const auto = modal.querySelector('#cloud-auto');
          if (auto) auto.addEventListener('change', function () {
            cloud.auto = auto.checked;
            saveCloud();
          });

          const connect = modal.querySelector('#cloud-connect');
          if (connect) connect.addEventListener('click', function () {
            cloudConnect(modal.querySelector('#cloud-client-id').value);
          });

          const copy = modal.querySelector('#cloud-copy');
          if (copy) copy.addEventListener('click', async function () {
            try {
              await navigator.clipboard.writeText(redirectUri);
              toast('Redirect URI скопирован');
            } catch (err) {
              toast('Скопируйте адрес вручную', 'error');
            }
          });
        },
      }
    );
  }

  /* ------------------------------ demo ------------------------------ */

  function makeDemoInvoice(items, picks, number, days, customer, markup) {
    const lines = picks.map(function (pair) {
      const item = pair[0];
      const qty = pair[1];
      const cost = round2(item.price);
      const sale = round2(cost * (1 + markup / 100));
      return {
        itemId: item.id, name: item.name, sku: item.sku, unit: item.unit, qty: qty,
        cost: cost, sale: sale, sumCost: round2(cost * qty), sumSale: round2(sale * qty),
      };
    });
    return {
      id: uid(),
      number: String(number),
      date: isoDaysAgo(days),
      customer: customer,
      markup: markup,
      lines: lines,
      totalCost: round2(lines.reduce(function (s, l) { return s + l.sumCost; }, 0)),
      totalSale: round2(lines.reduce(function (s, l) { return s + l.sumSale; }, 0)),
      deducted: false,
      createdAt: new Date().toISOString(),
    };
  }

      inn: '7712345678',
      address: 'г. Москва, ул. Строителей, д. 12, оф. 4',

      director: 'Иванов И. И.',
      accountant: 'Петрова А. С.',
    };
    const mk = function (name, sku, unit, price, qty) {
      return { id: uid(), name: name, sku: sku, unit: unit, price: price, qty: qty };
    };
    s.items = [
      mk('Кабель ВВГнг(А)-LS 3×2,5', 'ВВГ-3х2.5', 'м', 62.5, 350),
      mk('Автоматический выключатель IEK C16 1P', 'BA47-16', 'шт', 245, 48),
      mk('Розетка Schneider AtlasDesign, белая', 'ATN000111', 'шт', 310, 60),
      mk('Светильник светодиодный 36 Вт IP65', 'LED-36-IP65', 'шт', 1890, 7),
      mk('Гофра ПВХ 20 мм с зондом', 'GF-20', 'м', 18.9, 500),
      mk('Подрозетник бетонный 68×42', 'PZ-68', 'шт', 42, 120),
      mk('Щиток навесной 12 модулей', 'SH-12', 'шт', 1250, 8),
      mk('Саморез 3,5×25, упаковка 100 шт', 'SAM-35', 'упак', 95, 75),
      mk('Труба металлическая ДКС 25 мм', 'TR-25', 'м', 76.4, 210),

    s.catalog = s.items.map(function (it) {
      return { id: uid(), name: it.name, sku: it.sku, price: it.price };
    }).concat([
      { id: uid(), name: 'Контактор IEK КМИ-22510, 25 А', sku: 'KMI-25', price: 1150 },
      { id: uid(), name: 'Клеммник WAGO 221-415, 5 проводов', sku: 'WAGO-221-415', price: 38 },
      { id: uid(), name: 'Кабель-канал 40×25 мм, 2 м', sku: 'KK-40-25', price: 210 },
    ]);

    s.invoices = [
      makeDemoInvoice(s.items, [[s.items[0], 120], [s.items[4], 200], [s.items[8], 40]], 1, 9, 'ООО «СтройГарант»', 100),
      makeDemoInvoice(s.items, [[s.items[1], 12], [s.items[2], 20], [s.items[3], 4]], 2, 3, 'ИП Сергеев А. В.', 100),
    ];
    s.settings = { markup: 100, nextNumber: 3 };

  }

  async function seedDemo() {
    if (state.items.length || state.invoices.length || state.catalog.length) {
      const ok = await confirmDialog('Загрузить пример?', 'Текущие каталог, номенклатура и счета будут заменены демонстрационными данными.', 'Загрузить', false);
      if (!ok) return;
    }
    state = demoData();
    saveState();
    ui.draft = newDraft();
    ui.viewInvoice = null;
    ui.tab = 'items';
    ui.itemSearch = '';
    ui.catalogSearch = '';
    ui.pickSearch = '';
    closeModal();
    renderApp();
    toast('Демо-данные загружены');
  }

  /* ------------------------------ shell ------------------------------ */

  function renderApp() {
    $$('#tabs .tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === ui.tab);
    });
    const view = $('#view');
    view.className = 'app-main';
    updateCloudBadge();

    if (!storageOk) {
      view.innerHTML = '<div class="banner">' + icon('alert') +
        '<div><b>Автосохранение недоступно.</b> Браузер блокирует локальное хранилище для этого файла. Скачайте резервную копию в настройках, чтобы не потерять данные.</div></div>' +
        '<div id="view-body"></div>';
      const body = $('#view-body');
      if (ui.tab === 'items') renderItems(body);
      else if (ui.tab === 'catalog') renderCatalog(body);
      else if (ui.tab === 'stock') renderStock(body);
      else renderInvoices(body);
      return;
    }

    if (ui.tab === 'items') renderItems(view);
    else if (ui.tab === 'catalog') renderCatalog(view);
    else if (ui.tab === 'stock') renderStock(view);
    else renderInvoices(view);
  }

  function init() {
    state = loadState();
    cloud = loadCloud();
    initPrintFallback();
    const syncBtn = $('#btn-sync');
    if (syncBtn) {
      syncBtn.innerHTML = icon('refresh', 15) + '<span class="sync-label">Синхронизировать</span>';
      syncBtn.addEventListener('click', manualCloudSync);
    }
    const cloudBtn = $('#btn-cloud');
    if (cloudBtn) {
      cloudBtn.innerHTML = icon('cloud', 19);
      cloudBtn.addEventListener('click', openCloudModal);
    }
    $('#btn-settings').innerHTML = icon('settings', 19);
    $('#btn-settings').addEventListener('click', openSettings);

    $$('#tabs .tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (ui.tab === btn.dataset.tab) return;
        ui.tab = btn.dataset.tab;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    renderApp();
    updateCloudBadge();
    appReady = true;
    cloudHandleCallback().then(function (handled) {
      if (handled) renderApp();
    });
    setTimeout(cloudAutoCheck, 2500);
    setInterval(cloudAutoCheck, 30 * 60 * 1000);
    setInterval(cloudPoll, CLOUD_POLL_INTERVAL);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        cloudAutoCheck();
        cloudPoll();
      }
    });
  }

  window.__nom = {
    get state() { return state; },
    ui: ui,
    render: renderApp,
    seedDemo: seedDemo,
    demoData: demoData,
    newDraft: newDraft,
    draftToInvoice: draftToInvoice,
    parseImportFile: parseImportFile,
    openImportModal: openImportModal,
    exportItems: exportItems,
    exportStock: exportStock,
    exportInvoice: exportInvoice,
    invoiceHtml: invoiceHtml,
    printCurrent: printCurrent,
    cloud: {
      get state() { return cloud; },
      connected: cloudConnected,
      sync: cloudSync,
      autoCheck: cloudAutoCheck,
      connect: cloudConnect,
      handleCallback: cloudHandleCallback,
      payload: cloudPayload,
      apply: applyCloudPayload,
      pkce: pkceChallenge,
      status: cloudStatusHtml,
      open: openCloudModal,
    },
  };

  init();
})();
